databases:
  - name: purslip-db
    databaseName: purslip
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: purslip
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PGSSL
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: purslip-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
